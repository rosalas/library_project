[project]
name = "library-pipeline"
version = "0.1.0"
description = "Automated library pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.16.0",
    "python-dotenv>=1.2.4",
    "respx>=0.23.1",
    "rich>=15.0.0",
    "ruff>=0.16.10",
]

[project.scripts]
library-pipeline = "library_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
